<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
:root{ --bg:#efede9; --ink:#141414; --teal:#3cc6b2; --teal-d:#1f9e8b; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);font-family:Poppins,sans-serif;color:var(--ink)}
.layer{position:absolute;inset:0}
.handle{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-weight:800;font-size:27px;z-index:9}

/* cartel con cinta */
.poster{position:absolute;z-index:4;box-shadow:0 22px 40px rgba(20,20,20,.28)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;top:-20px;left:50%;width:150px;height:42px;transform:translateX(-50%) rotate(-2deg);
  background:rgba(60,198,178,.82);z-index:2;clip-path:polygon(2% 0,98% 6%,100% 100%,0 94%)}

.kicker{font-weight:800;font-size:30px;letter-spacing:.3em;text-transform:uppercase}
.kicker b{color:var(--teal-d);font-weight:800}
.h1{font-weight:900;font-size:136px;line-height:.93;text-transform:uppercase;letter-spacing:-.01em}
.script{font-family:'Instrument Serif',serif;font-style:italic;color:var(--teal-d);line-height:1}
.body{font-size:36px;line-height:1.38;font-weight:400}
.body b{font-weight:800}
.part{display:inline-block;font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--teal);padding:6px 18px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-4deg)}

.num{font-weight:700;font-size:190px;line-height:.9;color:transparent;-webkit-text-stroke:4px var(--ink);letter-spacing:-.02em}
.party{font-weight:800;font-size:50px;line-height:1.05;margin-top:26px}
.tag{display:inline-block;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  background:var(--teal);padding:8px 18px;box-shadow:5px 5px 0 var(--ink)}
.lbl{font-weight:800;font-size:21px;letter-spacing:.22em;text-transform:uppercase}
.claim{font-family:'Instrument Serif',serif;font-style:italic;font-size:48px;line-height:1.08;margin-top:8px}

.grid{position:absolute;left:75px;right:75px;top:520px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 26px;z-index:4}
.cell .thumb{height:210px;overflow:hidden;box-shadow:0 12px 24px rgba(20,20,20,.22)}
.cell .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cell .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.cell .n{font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t{font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;background:var(--teal);padding:3px 8px;white-space:nowrap}
</style></head>
<body><div id="root"></div>
<script>
const data = window.__DATA__, i = window.__INDEX__;
const items = data.items, total = items.length + 2, W = 1080, H = 1350;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => String(n).padStart(2,'0');
const img = f => data._imgs[f];

/* Línea ondulada continua: cada slide enseña su tramo, así al deslizar se une */
function wave(idx){
  const pts = [];
  for (let x = 0; x <= total * W; x += 16) {
    const y = 610 + 70 * Math.sin(x / 520 + 0.4) + 30 * Math.sin(x / 210 + 1.7);
    pts.push(`${x},${y.toFixed(1)}`);
  }
  return `<svg class="layer" style="z-index:2" viewBox="${idx*W} 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const poster = ({f, x, y, w, rot, z=4, tape=true, pos='center'}) => {
  const h = w / img(f).ratio;
  return `<div class="poster" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);z-index:${z}">
    ${tape?'<div class="tape"></div>':''}<img src="${img(f).src}" style="object-position:${pos}"></div>`;
};
// cartel del collage de portada que se sale por la derecha y asoma en la slide 2
const bridge = idx => poster({f: data.cover.collage[2], x: 905 - idx*W, y: 600, w: 230, rot: 8, z: 1, tape: idx===0});
const handle = `<div class="handle">${esc(data.handle)}</div>`;

let html;
if (i === 0) {
  const c = data.cover;
  html = `<section class="slide">${wave(0)}
    <div style="position:absolute;left:75px;top:100px;right:60px;z-index:5">
      <div class="kicker">${esc(c.kicker)} <b>${esc(c.kickerAccent)}</b></div>
      <div class="h1" style="margin-top:28px">${esc(c.title).replace(' ','<br>')}</div>
      <div style="display:flex;align-items:center;gap:34px;margin-top:4px">
        <span class="script" style="font-size:150px">${esc(c.script)}</span>
        <span class="part">${esc(c.part)}</span>
      </div>
    </div>
    <div class="body" style="position:absolute;left:75px;top:790px;width:470px;z-index:5">${c.body}</div>
    ${bridge(0)}
    ${poster({f:c.collage[0], x:575, y:800, w:290, rot:-6, z:3})}
    ${poster({f:c.collage[1], x:740, y:880, w:290, rot:5, z:4})}
    ${handle}</section>`;
} else if (i <= items.length) {
  const it = items[i-1], left = i % 2 === 1;           // impares: cartel a la izquierda
  const ph = 760, pw = Math.min(620, ph * img(it.img).ratio);
  const px = left ? 70 : W - 70 - pw;
  const tx = left ? px + pw + 50 : 75, tw = left ? W - 60 - tx : px - 50 - 75;
  html = `<section class="slide">${wave(i)}
    ${i===1 ? bridge(1) : ''}
    ${poster({f:it.img, x:px, y:82, w:pw, rot:left?-1.5:1.5})}
    <div style="position:absolute;left:${tx}px;top:80px;width:${tw}px;z-index:5">
      <div class="num">${num(i)}</div>
      <div class="party">${esc(it.party)}</div>
    </div>
    <div style="position:absolute;left:${tx}px;top:560px;width:${tw}px;z-index:5">
      <span class="tag">${esc(it.tag)}</span>
      <div class="lbl" style="margin-top:50px">Claim</div>
      <div class="claim">«${esc(it.claim)}»</div>
    </div>
    <div class="body" style="position:absolute;left:75px;right:75px;top:900px;z-index:5">${it.text}</div>
    ${handle}</section>`;
} else {
  const o = data.outro;
  html = `<section class="slide">${wave(i)}
    <div class="h1" style="position:absolute;left:75px;top:100px;width:900px;font-size:128px;line-height:1.02;text-transform:none;z-index:5">${esc(o.title)}</div>
    <div class="grid">${items.map(it=>`<div class="cell"><div class="thumb"><img src="${img(it.img).src}" style="object-position:${it.thumbPos||'50% 35%'}"></div>
      <div class="meta"><span class="n">${esc(it.short||it.party)}</span><span class="t">${esc(it.tag)}</span></div></div>`).join('')}</div>
    <div class="body" style="position:absolute;left:75px;right:75px;top:1090px;z-index:5">${o.body}</div>
    ${handle}</section>`;
}
document.getElementById('root').innerHTML = html;
</script></body></html>
