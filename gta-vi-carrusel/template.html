<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
:root{
  --sky:#8592d8; --lilac:#b48ccc; --rose:#e6a0b0; --peach:#f6b27f; --sand:#f9cf9e;
  --plum:#6e3f7f; --ink:#1d1430; --cream:#fff6ee; --teal:#3cc6b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--rose)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--lilac) 30%,var(--rose) 55%,var(--peach) 80%,var(--sand) 100%)}
/* nubes suaves */
.cloud{position:absolute;border-radius:50%;background:rgba(255,226,226,.38);filter:blur(38px)}
.layer{position:absolute;inset:0}
.palm{position:absolute;fill:var(--plum)}
.handle{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-weight:800;font-size:26px;letter-spacing:.02em;z-index:9}

/* tarjetas */
.card{position:absolute;background:#fff;border-radius:10px;box-shadow:0 26px 50px rgba(29,20,48,.30);overflow:visible;z-index:4}
.card .clip{position:absolute;inset:0;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .logo{max-width:74%;max-height:66%;object-fit:contain}
.card .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;top:-22px;left:50%;width:170px;height:46px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(60,198,176,.78);z-index:2;clip-path:polygon(2% 0,98% 6%,100% 100%,0 94%)}
.badge{position:absolute;z-index:3;font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--teal);color:var(--ink);padding:8px 22px;box-shadow:5px 5px 0 var(--ink)}

/* portada */
.kicker{font-weight:800;font-size:30px;letter-spacing:.32em;text-transform:uppercase}
.kicker b{color:var(--cream)}
.h1{font-weight:900;font-size:128px;line-height:.95;text-transform:uppercase;letter-spacing:-.01em}
.script{font-family:'Instrument Serif',serif;font-style:italic;color:var(--cream);line-height:1}
.body{font-size:38px;line-height:1.32;font-weight:400}
.body b{font-weight:800}

/* comparativa */
.num{font-weight:800;font-size:210px;line-height:.9;color:transparent;-webkit-text-stroke:4px var(--ink);letter-spacing:-.02em}
.bname{font-weight:900;font-size:62px;line-height:1.05;margin-top:22px}
.lbl{font-weight:800;font-size:22px;letter-spacing:.24em;text-transform:uppercase;margin-top:44px}
.rname{font-family:'Instrument Serif',serif;font-style:italic;font-size:66px;line-height:1.05;margin-top:6px}
.vs{position:absolute;font-family:'Instrument Serif',serif;font-style:italic;font-size:170px;line-height:1;color:var(--cream);z-index:5;
  text-shadow:0 6px 24px rgba(110,63,127,.35)}

/* cierre */
.grid{position:absolute;left:70px;right:70px;top:430px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px;z-index:4}
.cell .thumb{position:relative;height:200px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 14px 28px rgba(29,20,48,.25);display:flex;align-items:center;justify-content:center}
.cell .thumb .logo{max-width:80%;max-height:70%;object-fit:contain}
.cell .thumb .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .meta{display:flex;flex-direction:column;align-items:flex-start;margin-top:12px;gap:6px}
.cell .n{font-weight:800;font-size:24px;white-space:nowrap}
.cell .t{font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--teal);padding:3px 8px;white-space:nowrap}
</style></head>
<body><div id="root"></div>
<script>
const data = window.__DATA__, i = window.__INDEX__;
const pairs = data.pairs, total = pairs.length + 2, W = 1080, H = 1350;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => String(n).padStart(2,'0');

/* ---------- línea ondulada continua a lo largo de todo el carrusel ---------- */
function wave(idx){
  const pts = [];
  for (let x = 0; x <= total * W; x += 16) {
    const y = 660 + 95 * Math.sin(x / 470 + 0.9) + 38 * Math.sin(x / 190 + 2.1);
    pts.push(`${x},${y.toFixed(1)}`);
  }
  return `<svg class="layer" style="z-index:2" viewBox="${idx*W} 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---------- palmera en silueta (generada) ---------- */
function frond(L, ang){
  const P = t => [2*(1-t)*t*L*0.5 + t*t*L, 2*(1-t)*t*(-L*0.28) + t*t*(L*0.30)];
  const T = t => { const a=[2*(1-t)*L*0.5 + 2*t*(L-L*0.5), 2*(1-t)*(-L*0.28) + 2*t*(L*0.30+L*0.28)]; const m=Math.hypot(...a); return [a[0]/m,a[1]/m]; };
  let d = '';
  // raquis
  const a = P(0), b = P(.5), c = P(1);
  d += `M0,-5 Q${L*0.5},${-L*0.28-6} ${c[0]},${c[1]} Q${L*0.5},${-L*0.28+6} 0,5Z`;
  for (let t = .06; t < .98; t += .045) {
    const [px,py] = P(t), [tx,ty] = T(t);
    const len = L*0.30*Math.sin(Math.PI*Math.min(1,t*1.15))*(1-t*.35);
    for (const s of [1,-1]) {
      // foliolo: perpendicular, caído hacia abajo
      let nx = -ty*s, ny = tx*s; nx = nx*0.55 + tx*0.45; ny = ny*0.55 + ty*0.45 + 0.35;
      const m = Math.hypot(nx,ny); nx/=m; ny/=m;
      const ex = px+nx*len, ey = py+ny*len, w = 7;
      d += `M${(px-tx*w).toFixed(1)},${(py-ty*w).toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)} L${(px+tx*w).toFixed(1)},${(py+ty*w).toFixed(1)}Z`;
    }
  }
  return `<path transform="rotate(${ang})" d="${d}"/>`;
}
function palm({x, y, h, flip=false, lean=0, op=.55}){
  const cx = 200 + lean, cy = 120;
  const trunk = `M${190},${h} Q${200+lean*0.2},${(h+cy)/2} ${cx-6},${cy} L${cx+6},${cy} Q${214+lean*0.2},${(h+cy)/2} ${214},${h}Z`;
  const angs = [-170,-140,-112,-80,-48,-18,12,40,-200];
  const fr = angs.map((a,k)=>frond(k%2?250:290, a)).join('');
  return `<svg class="palm" style="left:${x}px;top:${y}px;width:400px;height:${h}px;opacity:${op};transform:${flip?'scaleX(-1)':''};z-index:1"
    viewBox="0 0 400 ${h}" overflow="visible"><path d="${trunk}"/><g transform="translate(${cx},${cy})">${fr}</g></svg>`;
}
const clouds = () => `
  <div class="cloud" style="left:-120px;top:420px;width:620px;height:120px"></div>
  <div class="cloud" style="left:520px;top:520px;width:700px;height:110px"></div>
  <div class="cloud" style="left:200px;top:300px;width:420px;height:80px;opacity:.7"></div>`;

const media = (src, label, shot, cls='') => {
  if (!src) return `<div style="font-weight:900;font-size:60px;text-align:center">${esc(label)}</div>`;
  if (shot) { const pos = shot.pos||'center', z = shot.zoom||1;
    return `<img class="shot" src="${src}" style="object-position:${pos};transform:scale(${z});transform-origin:${pos}">`; }
  return `<img class="logo" src="${src}">`;
};
const card = ({x,y,w,h,rot,src,label,shot,badge,badgePos}) => `
  <div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
    <div class="tape"></div>
    <div class="clip">${media(src,label,shot)}</div>
    ${badge?`<span class="badge" style="${badgePos}">${esc(badge)}</span>`:''}
  </div>`;
const handle = `<div class="handle">${esc(data.handle)}</div>`;

let html;
if (i === 0) {
  const c = data.cover;
  const picks = [pairs[0], pairs[1], pairs[3]];
  html = `<section class="slide">${clouds()}
    ${palm({x:-150,y:620,h:760,flip:true,lean:-30,op:.5})}
    ${wave(0)}
    <div style="position:absolute;left:72px;top:96px;right:72px;z-index:5">
      <div class="kicker">Parodias · <b>${esc(c.kicker)}</b></div>
      <div class="h1" style="margin-top:26px">Las marcas<br>de GTA VI</div>
      <div class="script" style="font-size:132px;margin-top:6px">${esc(c.script)}</div>
    </div>
    <div class="body" style="position:absolute;left:72px;top:800px;width:440px;z-index:5">${c.body}</div>
    ${card({x:560,y:830,w:330,h:250,rot:-7,src:picks[2]._fakeSrc,label:picks[2].fake,shot:picks[2].fakeShot})}
    ${card({x:700,y:930,w:330,h:250,rot:5,src:picks[1]._fakeSrc,label:picks[1].fake,shot:picks[1].fakeShot})}
    ${card({x:600,y:1010,w:340,h:240,rot:-2,src:picks[0]._fakeSrc,label:picks[0].fake,shot:picks[0].fakeShot})}
    ${handle}</section>`;
} else if (i <= pairs.length) {
  const p = pairs[i-1], flip = i % 2 === 0;
  const tx = flip ? 650 : 72;            // columna de texto
  const gx = flip ? 70 : 450;            // tarjeta GTA
  const rx = flip ? 440 : 80;            // tarjeta real
  html = `<section class="slide">${clouds()}
    ${palm({x: flip? -170 : 850, y:640, h:740, flip: !flip, lean:-25, op:.45})}
    ${wave(i)}
    <div style="position:absolute;left:${tx}px;top:80px;width:360px;z-index:5">
      <div class="num">${num(i)}</div>
      <div class="bname">${esc(p.fake)}</div>
      <div class="lbl">Parodia de</div>
      <div class="rname">«${esc(p.real)}»</div>
    </div>
    ${card({x:gx,y:110,w:560,h:520,rot:flip?-2:2,src:p._fakeSrc,label:p.fake,shot:p.fakeShot,badge:'GTA VI',badgePos:'left:-18px;bottom:28px'})}
    ${card({x:rx,y:760,w:560,h:400,rot:flip?2.5:-2.5,src:p._realSrc,label:p.real,shot:p.realShot,badge:'Vida real',badgePos:'right:-18px;bottom:28px'})}
    <div class="vs" style="left:${flip?150:760}px;top:860px">vs.</div>
    ${handle}</section>`;
} else {
  const o = data.outro;
  html = `<section class="slide">${clouds()}
    ${palm({x:860,y:700,h:700,lean:-25,op:.4})}
    ${wave(i)}
    <div class="h1" style="position:absolute;left:72px;top:96px;width:900px;font-size:112px;line-height:1.08;text-transform:none;z-index:5">${esc(o.title)}</div>
    <div class="grid">${pairs.map(p=>`<div class="cell"><div class="thumb">${media(p._fakeSrc,p.fake,p.fakeShot)}</div>
      <div class="meta"><span class="n">${esc(p.fake)}</span><span class="t">${esc(p.real)}</span></div></div>`).join('')}</div>
    <div class="body" style="position:absolute;left:72px;right:72px;top:1120px;z-index:5">${o.body}</div>
    ${handle}</section>`;
}
document.getElementById('root').innerHTML = html;
</script></body></html>
